<VirtualHost *:80>
    DocumentRoot /srv/www/dashboard/public

    <Directory /srv/www/dashboard/public>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/dashboard-error.log
    CustomLog ${APACHE_LOG_DIR}/dashboard-access.log combined
</VirtualHost>
